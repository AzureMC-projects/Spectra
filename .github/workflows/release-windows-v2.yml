name: Build and publish Spectra v0.2.1 for Windows

on:
  push:
    branches:
      - "v2-development"
    tags:
      - "v2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build applications
        run: cmake --build build --config Release --parallel 2

      - name: Bundle Qt runtime
        shell: pwsh
        run: |
          $apps = @("Spectra.exe", "Spectra Simulator.exe")
          $deploy = Get-Command windeployqt.exe -ErrorAction Stop
          foreach ($app in $apps) {
            $exe = Join-Path $PWD ("build/Release/" + $app)
            if (!(Test-Path $exe)) { throw "$app was not built at $exe" }
            & $deploy.Source --release --compiler-runtime $exe
            if ($LASTEXITCODE -ne 0) { throw "windeployqt failed for $app" }
          }

      - name: Configure Qt plugin lookup and verify deployment
        shell: pwsh
        run: |
          $bin = Join-Path $PWD "build/Release"
          $platformPlugin = Join-Path $bin "platforms/qwindows.dll"
          if (!(Test-Path $platformPlugin)) {
            $qtRoot = $env:QT_ROOT_DIR
            $candidates = @()
            if ($qtRoot) { $candidates += Join-Path $qtRoot "plugins/platforms/qwindows.dll" }
            $candidates += Get-ChildItem -Path $env:RUNNER_TEMP -Filter qwindows.dll -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
            $source = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (!$source) { throw "Qt Windows platform plugin qwindows.dll was not found after windeployqt." }
            New-Item -ItemType Directory -Force -Path (Split-Path $platformPlugin) | Out-Null
            Copy-Item $source $platformPlugin -Force
          }
          # Explicitly tell Qt to find the platform plugin relative to the executable.
          Set-Content -Path (Join-Path $bin "qt.conf") -Value "[Paths]`nPlugins=." -Encoding ascii
          if (!(Test-Path (Join-Path $bin "platforms/qwindows.dll"))) { throw "platforms/qwindows.dll missing from bundle" }
          if (!(Test-Path (Join-Path $bin "qt.conf"))) { throw "qt.conf missing from bundle" }

      - name: Verify and package applications
        shell: pwsh
        run: |
          if (!(Test-Path "build/Release/Spectra.exe")) { throw "Spectra.exe missing" }
          if (!(Test-Path "build/Release/Spectra Simulator.exe")) { throw "Spectra Simulator.exe missing" }
          if (!(Test-Path "build/Release/platforms/qwindows.dll")) { throw "Qt Windows platform plugin missing" }
          Compress-Archive -Path "build/Release/*" -DestinationPath "Spectra-Windows-v0.2.1.zip" -Force
          if (!(Test-Path "Spectra-Windows-v0.2.1.zip")) { throw "ZIP package missing" }

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/v2-development'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2
          name: Spectra v0.2.1
          generate_release_notes: true
          files: Spectra-Windows-v0.2.1.zip
