name: Build Windows EXE for v1 release

on:
  push:
    tags:
      - "v1"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and publish Spectra for Windows
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build applications
        run: cmake --build build --config Release --parallel 2

      - name: Bundle Qt and MSVC runtime dependencies
        shell: pwsh
        run: |
          $apps = @("Spectra.exe", "Spectra Simulator.exe")
          $deploy = Get-Command windeployqt.exe -ErrorAction Stop
          foreach ($app in $apps) {
            $exe = Join-Path $PWD ("build/Release/" + $app)
            if (!(Test-Path $exe)) {
              throw "$app was not found at $exe"
            }
            & $deploy.Source --release --compiler-runtime $exe
            if ($LASTEXITCODE -ne 0) {
              throw "windeployqt failed for $app with exit code $LASTEXITCODE"
            }
          }

      - name: Package Windows applications
        shell: pwsh
        run: |
          if (!(Test-Path "build/Release/Spectra.exe") -or !(Test-Path "build/Release/Spectra Simulator.exe")) {
            throw "Expected Windows executables were not created."
          }
          Compress-Archive -Path "build/Release/*" -DestinationPath "Spectra-Windows-v1.zip" -Force
          if (!(Test-Path "Spectra-Windows-v1.zip")) {
            throw "Windows release ZIP was not created."
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1
          name: Spectra v1
          generate_release_notes: true
          files: Spectra-Windows-v1.zip
