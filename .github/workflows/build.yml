name: Build Spectra

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: linux
          target: desktop
          arch: gcc_64
          cache: true

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build both apps
        run: cmake --build build --config Release --parallel 2

      - name: Upload Linux builds
        uses: actions/upload-artifact@v4
        with:
          name: spectra-linux
          path: |
            build/Spectra
            build/Spectra Simulator
          if-no-files-found: warn

  build-windows:
    name: Build Windows EXEs
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel
          cache: true

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build both apps
        run: cmake --build build --config Release --parallel 2

      - name: Bundle Qt and MSVC runtime dependencies
        shell: pwsh
        run: |
          $apps = @("Spectra.exe", "Spectra Simulator.exe")
          $deploy = Get-Command windeployqt.exe -ErrorAction Stop
          foreach ($app in $apps) {
            $exe = Join-Path $PWD ("build/Release/" + $app)
            if (!(Test-Path $exe)) {
              throw "$app was not found at $exe"
            }
            & $deploy.Source --release --compiler-runtime $exe
            if ($LASTEXITCODE -ne 0) {
              throw "windeployqt failed for $app with exit code $LASTEXITCODE"
            }
          }

      - name: Upload Windows app bundle
        uses: actions/upload-artifact@v4
        with:
          name: spectra-windows
          path: build/Release/
          if-no-files-found: error
