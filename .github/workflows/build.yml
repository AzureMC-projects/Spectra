name: Build Spectra

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: linux
          target: desktop
          arch: gcc_64
          cache: true

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Spectra
        run: cmake --build build --config Release --parallel 2

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: spectra-linux
          path: build/Spectra
          if-no-files-found: error

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build Spectra
        run: cmake --build build --config Release --parallel 2

      - name: Bundle Qt runtime dependencies
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "build/Release/Spectra.exe"
          if (!(Test-Path $exe)) {
            throw "Spectra.exe was not found at $exe"
          }
          $qtBin = Join-Path $env:Qt6_DIR "../../bin"
          $windeployqt = Get-ChildItem -Path $env:Qt6_DIR -Filter windeployqt.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$windeployqt) {
            $windeployqt = Get-ChildItem -Path $env:RUNNER_WORKSPACE -Filter windeployqt.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (!$windeployqt) {
            throw "Could not locate windeployqt.exe in the installed Qt directory"
          }
          & $windeployqt.FullName --release $exe
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }
          Copy-Item "$env:VCToolsRedistDir" "build/Release/msvc-runtime" -Recurse -ErrorAction SilentlyContinue

      - name: Upload Windows app bundle
        uses: actions/upload-artifact@v4
        with:
          name: spectra-windows
          path: build/Release/
          if-no-files-found: error
